name: build-desktop
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Configure
        run: cmake --preset ${{ runner.os == 'macOS' && 'macos-release' || 'windows-release' }}
      - name: Build
        run: cmake --build --preset ${{ runner.os == 'macOS' && 'build-macos' || 'build-windows' }} --parallel
      - name: Unit tests
        run: ctest --preset ${{ runner.os == 'macOS' && 'test-macos-release' || 'test-windows-release' }} -L unit
      - name: Get Project Name
        id: project-name
        shell: bash
        run: |
          PROJECT_NAME=$(grep '^project(' CMakeLists.txt | sed 's/project(\([^ ]*\).*/\1/')
          echo "name=$PROJECT_NAME" >> $GITHUB_OUTPUT
      - name: Package
        shell: bash
        env:
          GAME_NAME: ${{ steps.project-name.outputs.name }}
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "build/windows-release/${GAME_NAME}.exe" dist/
            cp build/windows-release/assets.pak dist/
          else
            APP_BUNDLE="build/macos-release/${GAME_NAME}.app"
            codesign --force --sign - "$APP_BUNDLE"
            codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
            ditto -c -k --keepParent "$APP_BUNDLE" "dist/${GAME_NAME}-macos.zip"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.project-name.outputs.name }}-${{ matrix.os }}
          path: dist
