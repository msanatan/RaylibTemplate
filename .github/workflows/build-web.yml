name: build-web
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: emscripten-core/setup-emsdk@v16
        with: { version: 7.0.0 }
      - name: Configure (emcmake)
        run: emcmake cmake --preset web-release
      - name: Build
        run: cmake --build --preset build-web --parallel
      - name: Get Project Name
        id: project-name
        run: |
          PROJECT_NAME=$(grep -oP '^project\(\K[^ ]+' CMakeLists.txt)
          echo "name=$PROJECT_NAME" >> $GITHUB_OUTPUT
      - name: Copy to index.html
        run: |
          cp build/web-release/game/${{ steps.project-name.outputs.name }}.html build/web-release/game/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.project-name.outputs.name }}-web
          path: |
            build/web-release/game/index.html
            build/web-release/game/${{ steps.project-name.outputs.name }}.*
